<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./modernist.css">
<style>
  a { color: var(--color-accent); text-decoration: none; }
  body { margin: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 var(--space-6); }
  .tabbar { display: flex; gap: var(--space-2); margin-bottom: var(--space-6); flex-wrap: wrap; }
  .tabbar a { padding: 9px 16px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--color-divider); }
  .tabbar a.active { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }
</style>
</helmet>

<nav class="nav">
  <div class="wrap" style="display:flex;align-items:center;width:100%;">
    <div class="nav-brand" style="display:flex;align-items:center;gap:10px;">
      <img src="./assets/mashoke-logo.png" alt="Mashoke Tech" style="width:30px;height:30px;object-fit:contain;"/>
      Mashoke Labs <span class="tag tag-outline" style="margin-left:4px;">Platform Admin</span>
    </div>
    <div style="margin-left:auto;">
      <a href="./AdminLogin.dc.html" class="btn btn-icon btn-secondary" title="Log out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
    </div>
  </div>
</nav>

<main class="wrap" style="padding-top:var(--space-8);padding-bottom:var(--space-8);">
  <h1>Audit log</h1>
  <p class="text-muted" style="margin-bottom:var(--space-4);">Every sensitive action taken across the platform, in order.</p>

  <div class="tabbar">
    <a href="./AdminOverview.dc.html">Overview</a>
    <a href="./AdminDashboard.dc.html">Institutions</a>
    <a href="./AdminUsers.dc.html">Users</a>
    <a href="./AdminBilling.dc.html">Billing &amp; revenue</a>
    <a href="./AdminSupport.dc.html">Support</a>
    <a href="./AdminAuditLog.dc.html" class="active">Audit log</a>
    <a href="./AdminSettings.dc.html">Settings</a>
  </div>

  <table class="table">
    <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th></tr></thead>
    <tbody>
      <sc-for list="{{ entries }}" as="e" hint-placeholder-count="8">
        <tr>
          <td class="text-muted" style="white-space:nowrap;">{{ e.time }}</td>
          <td style="font-weight:700;">{{ e.actor }}</td>
          <td>{{ e.action }}</td>
          <td class="text-muted">{{ e.target }}</td>
        </tr>
      </sc-for>
    </tbody>
  </table>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      entries: [
        { time: 'Jul 18, 09:14', actor: 'M. Kariuki (platform admin)', action: 'Suspended institution', target: 'Ridgeway College' },
        { time: 'Jul 18, 08:02', actor: 'M. Kariuki (platform admin)', action: 'Raised lecturer seat limit to 30', target: 'Northbridge Polytechnic' },
        { time: 'Jul 17, 22:47', actor: 'Registrar Office (institution admin)', action: 'Escalated issue to Mashoke Tech', target: 'Seat increase request' },
        { time: 'Jul 17, 16:31', actor: 'Dr. Amina Yusuf (lecturer)', action: 'Ran AI grading on 42 submissions', target: 'Data Structures — Midterm' },
        { time: 'Jul 17, 11:05', actor: 'M. Kariuki (platform admin)', action: 'Added institution', target: 'Delta Coding Academy' },
        { time: 'Jul 16, 19:20', actor: 'System', action: 'Invoice charged — $1,200.00', target: 'Summit Institute of Tech' },
        { time: 'Jul 16, 14:12', actor: 'A. Nkemdirim (student)', action: 'Password reset requested', target: 'Own account' },
        { time: 'Jul 15, 09:50', actor: 'M. Kariuki (platform admin)', action: 'Updated Enterprise plan pricing', target: 'Platform settings' },
      ],
    };
  }
}

</script>
</body>
</html>
