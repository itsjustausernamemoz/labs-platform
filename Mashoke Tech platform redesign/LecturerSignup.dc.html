<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./modernist.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  a { color: var(--color-accent); text-decoration: none; }
  a:hover { color: var(--color-accent-700); text-decoration: underline; }
  body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-6); }
</style>
</helmet>
<div style="width:100%;max-width:420px;">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:var(--space-6);justify-content:center;">
    <img src="./assets/mashoke-logo.png" alt="Mashoke Tech" style="width:34px;height:34px;object-fit:contain;"/>
    <span style="font-family:var(--font-heading);font-weight:800;font-size:16px;">Mashoke Labs</span>
  </div>
  <h2 style="text-align:center;margin-bottom:var(--space-1);">Request lecturer access</h2>
  <p class="text-muted" style="text-align:center;font-size:14px;margin-bottom:var(--space-6);">Create your staff account to start building exams.</p>

  <form onsubmit="{{ handleSubmit }}">
    <div class="field" style="margin-bottom:var(--space-4);">
      <label>Full name</label>
      <input class="input" placeholder="e.g. Dr. Amina Yusuf" value="{{ name }}" oninput="{{ onName }}"/>
    </div>
    <div class="field" style="margin-bottom:var(--space-4);">
      <label>Institution email</label>
      <input class="input" type="email" placeholder="lecturer@university.edu" value="{{ email }}" oninput="{{ onEmail }}"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-6);">
      <div class="field">
        <label>Password</label>
        <input class="input" type="password" placeholder="••••••••" value="{{ password }}" oninput="{{ onPassword }}"/>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input class="input" type="password" placeholder="••••••••" value="{{ confirm }}" oninput="{{ onConfirm }}"/>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block" style="justify-content:center;padding:var(--space-3);">Create account</button>
  </form>

  <div class="hr"></div>
  <p style="text-align:center;font-size:13px;">Already registered? <a href="./LecturerLogin.dc.html">Sign in</a></p>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: '', email: '', password: '', confirm: '' };
  onName = (e) => this.setState({ name: e.target.value });
  onEmail = (e) => this.setState({ email: e.target.value });
  onPassword = (e) => this.setState({ password: e.target.value });
  onConfirm = (e) => this.setState({ confirm: e.target.value });
  handleSubmit = (e) => { e.preventDefault(); window.location.href = './LecturerLogin.dc.html'; };
  renderVals() {
    const s = this.state;
    return { ...s, onName: this.onName, onEmail: this.onEmail, onPassword: this.onPassword, onConfirm: this.onConfirm, handleSubmit: this.handleSubmit };
  }
}

</script>
</body>
</html>
